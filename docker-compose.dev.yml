# Local development profile. Its credentials and OIDC endpoint are deliberately
# non-production values; use docker-compose.yml plus .env for an install.
name: copalibre-dev

x-development-environment: &development-environment
  DATABASE_URL: postgres://copalibre:copalibre_dev_only@postgres:5432/copalibre
  COPALIBRE_APP_URL: http://localhost:4321
  COPALIBRE_BOOTSTRAP_TOKEN: copalibre_dev_bootstrap_only
  COPALIBRE_JWKS_URI: http://oidc.invalid/jwks.json
  COPALIBRE_JWT_ISSUER: http://oidc.invalid
  COPALIBRE_JWT_AUDIENCE: copalibre
  COPALIBRE_OIDC_CLIENT_ID: copalibre-dev
  COPALIBRE_EMAIL_PROVIDER: smtp
  COPALIBRE_EMAIL_FROM: dev@copalibre.invalid
  COPALIBRE_SMTP_URL: smtp://mailpit:1025
  COPALIBRE_DATA_DIR: /var/lib/copalibre
  COPALIBRE_IN_CONTAINER: 'true'

x-application-build: &application-build
  context: .
  target: runtime

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: copalibre
      POSTGRES_PASSWORD: copalibre_dev_only
      POSTGRES_DB: copalibre
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copalibre -d copalibre']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025'
      - '1025:1025'
    profiles: ['infrastructure', 'containerized']

  # Real S3-compatible endpoint for local object-storage integration tests
  # — the production docker-compose.yml's own object-storage service only
  # publishes 9000 when an operator opts in; this dev profile always
  # publishes it, so `yarn workspace @copalibre/object-storage run
  # test:integration` can reach it directly from the host. Port 3900 is
  # mapped to host 9000 so existing `COPALIBRE_OBJECT_STORAGE_URL=http://
  # localhost:9000` settings keep working unchanged.
  object-storage:
    image: dxflrs/garage:v1.1.0
    environment:
      GARAGE_RPC_SECRET: c0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6e
    ports:
      - '9000:3900'
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - object-storage-dev-meta:/var/lib/garage/meta
      - object-storage-dev-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  clamd:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - '3310:3310'
    volumes:
      - clamav-dev-data:/var/lib/clamav
    profiles: ['infrastructure', 'containerized']

  # Provisions the dev bucket and access key the object-storage integration
  # suite (and this dev profile generally) expects. Garage's own image is a
  # single static binary with no shell, so this build stage just copies that
  # same pinned binary onto Alpine to sequence the bootstrap commands; no
  # separate object-storage tool (MinIO's `mc`, etc.) is pulled. It shares
  # object-storage's network namespace so the `garage` CLI can talk to it
  # over 127.0.0.1 exactly as it would via `docker compose exec
  # object-storage`, and shares its (read-only) metadata volume so the CLI
  # recognizes it as the same node. The access key ID/secret below are
  # fixed, non-secret, dev-only values (Garage requires its own `GK<24 hex>`
  # ID / 64-hex-char secret format, so they can't literally be
  # `copalibre_dev_only` the way MinIO's could — see
  # packages/object-storage/src/s3-profile.integration.test.ts for the
  # matching fallback). It re-runs idempotently on every `docker compose up`
  # and exits once provisioning is confirmed.
  object-storage-init:
    build:
      context: .
      dockerfile_inline: |
        FROM dxflrs/garage:v1.1.0 AS garage
        FROM alpine:3.21
        COPY --from=garage /garage /usr/local/bin/garage
    network_mode: 'service:object-storage'
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: c0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6ec0a11b6e
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - object-storage-dev-meta:/var/lib/garage/meta:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        if garage status | grep -q 'NO ROLE ASSIGNED'; then
          node_id=$$(garage status | awk '/NO ROLE ASSIGNED/{print $$1; exit}')
          garage layout assign -z dc1 -c 1G "$$node_id"
          garage layout apply --version 1
        fi
        garage bucket create copalibre-dev 2>&1 | grep -qv 'Error' || true
        if ! garage key info copalibre-dev-key >/dev/null 2>&1; then
          garage key import --yes GK636f70616c69627265646576 \
            636f70616c696272655f6465765f6f6e6c795f6f626a6563745f73746f726521 \
            -n copalibre-dev-key
        fi
        garage bucket allow --read --write --owner copalibre-dev --key copalibre-dev-key
        tail -f /dev/null
    healthcheck:
      test: ['CMD', 'garage', 'bucket', 'info', 'copalibre-dev']
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  migrate:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['containerized']

  api:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: api
      PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3001:3001'
    develop:
      watch:
        - path: ./apps/api
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  events:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: events
      PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3002:3002'
    develop:
      watch:
        - path: ./apps/events
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  worker:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: worker
      PORT: 3003
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ./apps/worker
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  scheduler:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: scheduler
      PORT: 3004
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ./apps/scheduler
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  web-ssr:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: web
      PORT: 3005
      COPALIBRE_API_INTERNAL_URL: http://api:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3005:3005'
    develop:
      watch:
        - path: ./apps/web
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  web:
    build:
      context: .
      target: web
    environment:
      COPALIBRE_JWT_ISSUER: http://oidc.invalid
      COPALIBRE_OIDC_CLIENT_ID: copalibre-dev
    ports:
      - '4321:4321'
    develop:
      watch:
        - path: ./apps/web
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

volumes:
  postgres-dev-data:
  object-storage-dev-meta:
  object-storage-dev-data:
  clamav-dev-data:
