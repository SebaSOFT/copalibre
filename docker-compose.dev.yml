# Local development profile. Its credentials and OIDC endpoint are deliberately
# non-production values; use docker-compose.yml plus .env for an install.
name: copalibre-dev

x-development-environment: &development-environment
  DATABASE_URL: postgres://copalibre:copalibre_dev_only@postgres:5432/copalibre
  COPALIBRE_APP_URL: http://localhost:4321
  COPALIBRE_BOOTSTRAP_TOKEN: copalibre_dev_bootstrap_only
  COPALIBRE_JWKS_URI: http://oidc.invalid/jwks.json
  COPALIBRE_JWT_ISSUER: http://oidc.invalid
  COPALIBRE_JWT_AUDIENCE: copalibre
  COPALIBRE_OIDC_CLIENT_ID: copalibre-dev
  COPALIBRE_EMAIL_PROVIDER: smtp
  COPALIBRE_EMAIL_FROM: dev@copalibre.invalid
  COPALIBRE_SMTP_URL: smtp://mailpit:1025
  COPALIBRE_DATA_DIR: /var/lib/copalibre
  COPALIBRE_IN_CONTAINER: 'true'

x-application-build: &application-build
  context: .
  target: runtime

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: copalibre
      POSTGRES_PASSWORD: copalibre_dev_only
      POSTGRES_DB: copalibre
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copalibre -d copalibre']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025'
      - '1025:1025'
    profiles: ['infrastructure', 'containerized']

  # Real S3-compatible endpoint for local object-storage integration tests
  # — the production docker-compose.yml's own object-storage service
  # only exposes the admin console (9001); this dev profile exposes the S3
  # API port (9000) too, so `yarn workspace @copalibre/object-storage run
  # test:integration` can reach it directly from the host.
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: copalibre_dev_only
      MINIO_ROOT_PASSWORD: copalibre_dev_only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - object-storage-dev-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  clamd:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - '3310:3310'
    volumes:
      - clamav-dev-data:/var/lib/clamav
    profiles: ['infrastructure', 'containerized']

  # Provisions the MinIO bucket the object-storage integration suite (and
  # this dev profile generally) expects. Keeps running idle with a healthcheck
  # so `docker compose --wait` reliably succeeds rather than failing when a
  # one-shot container exits.
  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ['/bin/sh']
    command:
      - -c
      - |
        mc alias set local http://object-storage:9000 copalibre_dev_only copalibre_dev_only &&
        mc mb --ignore-existing local/copalibre-dev &&
        tail -f /dev/null
    healthcheck:
      test: ['CMD', 'mc', 'ls', 'local/copalibre-dev']
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: ['infrastructure', 'containerized']

  migrate:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['containerized']

  api:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: api
      PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3001:3001'
    develop:
      watch:
        - path: ./apps/api
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  events:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: events
      PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3002:3002'
    develop:
      watch:
        - path: ./apps/events
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  worker:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: worker
      PORT: 3003
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ./apps/worker
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  scheduler:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: scheduler
      PORT: 3004
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ./apps/scheduler
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  web-ssr:
    build: *application-build
    environment:
      <<: *development-environment
      PRODUCT_ROLE: web
      PORT: 3005
      COPALIBRE_API_INTERNAL_URL: http://api:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3005:3005'
    develop:
      watch:
        - path: ./apps/web
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

  web:
    build:
      context: .
      target: web
    environment:
      COPALIBRE_JWT_ISSUER: http://oidc.invalid
      COPALIBRE_OIDC_CLIENT_ID: copalibre-dev
    ports:
      - '4321:4321'
    develop:
      watch:
        - path: ./apps/web
          action: rebuild
        - path: ./packages
          action: rebuild
    profiles: ['containerized']

volumes:
  postgres-dev-data:
  object-storage-dev-data:
  clamav-dev-data:
