nodeLinker: node-modules
enableGlobalCache: true

# Yarn 4.12+ disables dependency build scripts by default. CopaLibre opts back in:
# esbuild (Astro), swc, and Playwright rely on postinstall steps, and the
# architecture contract favors conventional ecosystem behavior
# (chaos-vault: copalibre-platform-architecture.md, "Package manager").
enableScripts: true

# npmMinimalAgeGate is deliberately left at Yarn's 24h default: a dependency
# published less than a day ago is refused with
#   YN0016: All versions satisfying "x.y.z" are quarantined
# That is Yarn's supply-chain protection, not an npm quarantine — the registry
# packument is clean. Wait it out for third-party packages.
#
# SebaSOFT's own packages (e.g. @sebasoft/neuron-js) are the documented
# exception; bypass the gate per-command instead of weakening it globally:
#   yarn add --no-time-gate <pkg>@<version>
# The gate only runs during resolution, so CI's `yarn install --immutable`
# against a committed lockfile is unaffected.

npmAuditIgnoreAdvisories:
  # Upstream has not yet released patched versions (>3.0.3 and >4.2.0) on npm.
  - 1240992 # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3)
  - 1240991 # GHSA-ch52-4w7c-c8xp (http-cache-semantics <=4.2.0)
