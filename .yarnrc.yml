nodeLinker: node-modules
enableGlobalCache: true

# Yarn 4.12+ disables dependency build scripts by default. CopaLibre opts back in:
# esbuild (Astro), swc, and Playwright rely on postinstall steps, and the
# architecture contract favors conventional ecosystem behavior
# (chaos-vault: copalibre-platform-architecture.md, "Package manager").
enableScripts: true
