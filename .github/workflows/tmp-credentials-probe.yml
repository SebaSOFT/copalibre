name: tmp credentials probe
on:
  push:
    branches: [fix/ci-docker-hub-login]
permissions:
  contents: read
jobs:
  empty-credentials:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        credentials:
          username: ${{ secrets.NO_SUCH_SECRET_A }}
          password: ${{ secrets.NO_SUCH_SECRET_B }}
        env:
          POSTGRES_PASSWORD: probe
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - run: echo "service started with empty credentials"
  real-credentials:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: probe
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - run: echo "service started with the Docker Hub credentials"
  step-login:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker pull nginx:1.29-alpine
