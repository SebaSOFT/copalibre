name: Release

# Established with the first release process. Cutting a release is: bump
# every package.json's version (see RELEASE.md), open a develop->main pull
# request, merge once its CI (release-gated, see ci.yml's release_candidate)
# is green. This workflow does the rest — tag, image publish, GitHub Release
# — triggered by the push to main that merge produces.
#
# Idempotent by design: a merge to main that doesn't carry a new version
# (e.g. a hotfix cherry-pick with no version bump) finds its v{version} tag
# already exists and completes as a no-op rather than failing or double-
# publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # apps/copalibre/package.json is the one version actually read at
      # runtime (its banner/--version output) — the single source of truth
      # this workflow reads from. Every other package.json is kept in
      # lockstep with it by convention, not re-derived here.
      - id: version
        run: |
          version=$(node -p "require('./apps/copalibre/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          is_prerelease=$(node -p "Boolean(/^[0-9]+\.[0-9]+\.[0-9]+-/.test(require('./apps/copalibre/package.json').version))")
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Recheck current registry advisories immediately before creating any
      # new release artifact; an existing tag keeps its idempotent no-op path.
      - name: Install Corepack for dependency audit
        if: steps.check.outputs.exists != 'true'
        run: npm install -g corepack@latest

      - name: Enable Corepack
        if: steps.check.outputs.exists != 'true'
        run: corepack enable

      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists != 'true'
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies for release audit
        if: steps.check.outputs.exists != 'true'
        run: yarn install --immutable

      - name: Audit all workspace dependencies
        if: steps.check.outputs.exists != 'true'
        run: yarn npm audit --all --recursive --no-deprecations

      - name: Audit GitHub Dependabot alerts
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-dependabot-alerts.mjs

      - name: Pull Docker Hub images through a mirror
        if: steps.check.outputs.exists != 'true'
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.exists != 'true'

      # Base images come from Docker Hub, which rate-limits anonymous pulls per runner address;
      # BuildKit takes them from Google's public mirror, which falls back to Docker Hub.
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.exists != 'true'
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        if: steps.check.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        if: steps.check.outputs.exists != 'true'
        run: |
          tags="--tag ghcr.io/sebasoft/copalibre:${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            tags="$tags --tag ghcr.io/sebasoft/copalibre:latest"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target runtime --push $tags .

      - name: Build and push web image
        if: steps.check.outputs.exists != 'true'
        run: |
          tags="--tag ghcr.io/sebasoft/copalibre-web:${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            tags="$tags --tag ghcr.io/sebasoft/copalibre-web:latest"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target web --push $tags .

      - name: Create and push tag
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v${{ steps.version.outputs.version }}" --generate-notes $prerelease_flag
