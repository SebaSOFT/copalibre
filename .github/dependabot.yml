version: 2
updates:
  # Covers every Yarn workspace under apps/*/packages/* through the single
  # root yarn.lock — Dependabot's npm ecosystem already resolves a Yarn
  # workspace root and every package.json it references, so one entry here
  # is correct, not one per workspace.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # @imgly/background-removal serves WebAssembly built for one exact onnxruntime-web release and
      # declares it as an exact peer. A lone runtime bump breaks background removal while every build
      # passes, so the two move together; scripts/check-runtime-peers.mjs catches a manual bump.
      background-removal:
        patterns:
          - '@imgly/background-removal'
          - 'onnxruntime-web'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
