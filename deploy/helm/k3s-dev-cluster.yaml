# A local multi-node K3s cluster (via k3d) used only to validate the Helm
# chart's release contract (0034) — never a production target. `servers: 1` +
# `agents: 2` gives three schedulable nodes so the single-logical-scheduler
# test (5.2) exercises real cross-node pod placement, not a single-node
# scheduler that trivially always picks the same pod.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: copalibre-validate
servers: 1
agents: 2
options:
  k3d:
    wait: true
    timeout: '120s'
  k3s:
    extraArgs:
      # No ingress needed — the validation script reaches services via
      # `kubectl port-forward`, not an external route.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
