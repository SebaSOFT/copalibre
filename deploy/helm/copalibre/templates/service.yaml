{{- range $name, $role := .Values.roles }}
{{- if $role.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "copalibre.fullname" $ }}-{{ $name }}
  labels:
    {{- include "copalibre.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: copalibre
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $role.port }}
      targetPort: http
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "copalibre.fullname" . }}-web
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: copalibre
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
