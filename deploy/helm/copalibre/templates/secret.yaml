{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copalibre.fullname" . }}-secret
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
  annotations:
    # Same ordering fix as templates/configmap.yaml — must exist before the
    # pre-install/pre-upgrade migrate Job (weight 0) starts.
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '-5'
    'helm.sh/hook-delete-policy': before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{- if has $key $.Values.secretKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- else }}
# externalSecrets.enabled is true — templates/externalsecret.yaml manages
# this Secret instead of a plain values-driven manifest here.
{{- end }}
