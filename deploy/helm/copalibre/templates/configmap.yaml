apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "copalibre.fullname" . }}-env
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
  annotations:
    # A plain (non-hook) resource is only applied in the main install/upgrade
    # phase, which runs AFTER pre-install/pre-upgrade hooks — the migrate Job
    # (weight 0) would then start before this ConfigMap exists to envFrom.
    # Making this a hook too, at an earlier weight, fixes that ordering.
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '-5'
    'helm.sh/hook-delete-policy': before-hook-creation
data:
  {{- range $key, $value := .Values.env }}
  {{- if not (has $key $.Values.secretKeys) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
