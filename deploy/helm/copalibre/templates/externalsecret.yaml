{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "copalibre.fullname" . }}-secret
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
  annotations:
    # Same ordering fix as templates/configmap.yaml — must exist before the
    # pre-install/pre-upgrade migrate Job (weight 0) starts.
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '-5'
    'helm.sh/hook-delete-policy': before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    # Same Secret name templates/secret.yaml would otherwise create — this
    # ExternalSecret replaces it (see the `not externalSecrets.enabled` guard
    # in secret.yaml), so templates/deployment.yaml's envFrom needs no
    # change either way.
    name: {{ include "copalibre.fullname" . }}-secret
    creationPolicy: Owner
  data:
    {{- range $key := .Values.secretKeys }}
    {{- $override := dict }}
    {{- if hasKey $.Values.externalSecrets.remoteRefs $key }}
    {{- $override = index $.Values.externalSecrets.remoteRefs $key }}
    {{- end }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $override.key | default $key }}
        property: {{ $override.property | default "value" }}
    {{- end }}
{{- end }}
