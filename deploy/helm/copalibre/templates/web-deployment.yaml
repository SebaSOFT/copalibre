apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "copalibre.fullname" . }}-web
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: copalibre
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copalibre
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: '{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}'
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            {{- range $key, $value := .Values.web.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          lifecycle:
            preStop:
              # Same reasoning as templates/deployment.yaml: give kube-proxy
              # time to drop this pod's endpoint before it stops accepting
              # connections, so a rolling update never drops a live request.
              exec:
                command: ['sh', '-c', 'sleep 5']
          startupProbe:
            httpGet:
              path: {{ .Values.web.probePath }}
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probePath }}
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probePath }}
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml (.Values.web.resources | default dict) | nindent 12 }}
