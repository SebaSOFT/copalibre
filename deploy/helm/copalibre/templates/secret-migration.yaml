{{- /*
The schema owner's credential. Only templates/job-migrate.yaml loads this
Secret; the Deployments, the doctor Job and the create-admin Job never see it.
Rendered only when a value or an external reference is configured; the Job's
reference to it is optional, so migrations fall back to DATABASE_URL.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- if hasKey .Values.externalSecrets.remoteRefs "DATABASE_MIGRATION_URL" }}
{{- $ref := index .Values.externalSecrets.remoteRefs "DATABASE_MIGRATION_URL" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "copalibre.fullname" . }}-migration-secret
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
  annotations:
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '-5'
    'helm.sh/hook-delete-policy': before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "copalibre.fullname" . }}-migration-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: {{ $ref.key | default "DATABASE_MIGRATION_URL" }}
        property: {{ $ref.property | default "value" }}
{{- end }}
{{- else if .Values.migrationEnv.DATABASE_MIGRATION_URL }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copalibre.fullname" . }}-migration-secret
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
  annotations:
    # Must exist before the pre-install/pre-upgrade migrate Job (weight 0) starts.
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '-5'
    'helm.sh/hook-delete-policy': before-hook-creation
type: Opaque
stringData:
  DATABASE_MIGRATION_URL: {{ .Values.migrationEnv.DATABASE_MIGRATION_URL | quote }}
{{- end }}
