apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "copalibre.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "copalibre.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Blocks the release rollout until migration succeeds — no api/worker pod
    # belonging to this release becomes ready before this Job completes.
    'helm.sh/hook': pre-upgrade,pre-install
    'helm.sh/hook-weight': '0'
    'helm.sh/hook-delete-policy': before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copalibre
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PRODUCT_ROLE
              value: migrate
          envFrom:
            - configMapRef:
                name: {{ include "copalibre.fullname" . }}-env
            - secretRef:
                name: {{ include "copalibre.fullname" . }}-secret
