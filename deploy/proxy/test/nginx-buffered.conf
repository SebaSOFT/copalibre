events {}

http {
  server {
    listen 8080;

    location /events/ {
      proxy_pass http://events:3002;
      proxy_http_version 1.1;
      # This fixture intentionally defeats CopaLibre's X-Accel-Buffering header.
      proxy_ignore_headers X-Accel-Buffering;
      proxy_buffering on;
      proxy_read_timeout 3600s;
    }
  }
}
