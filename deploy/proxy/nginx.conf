# If this NGINX instance sits behind another proxy or load balancer (a cloud
# LB, Cloudflare, ...), uncomment both directives below in every server block
# and scope set_real_ip_from to THAT proxy's actual address range — never a
# default that trusts every upstream — so NGINX only honors X-Forwarded-For
# from a network the operator actually controls. Leave commented when NGINX
# is the public edge itself, as it is in the default single-host Compose
# deployment.
# set_real_ip_from 203.0.113.0/24;
# real_ip_header X-Forwarded-For;

server {
  listen 80;
  server_name app.copalibre.example;

  # TLS belongs in this edge server. Replace the sample certificate directives
  # with the host's certificate management before exposing this listener.
  location / {
    proxy_pass http://web:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name api.copalibre.example;

  location / {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name events.copalibre.example;

  location / {
    proxy_pass http://events:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no always;
    proxy_read_timeout 3600s;
  }

}
