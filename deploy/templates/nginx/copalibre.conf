# CopaLibre Reverse Proxy Configuration for Nginx / CloudPanel
# Sits in front of CopaLibre single-host deployment (gateway on port 8080)

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name play.example.com; # Replace with your public domain

  # Standard security and proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;

  # Allow large tournament imports, backups, and media asset uploads
  client_max_body_size 100M;
  proxy_request_buffering off;

  # WebSocket upgrade support
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # Dedicated Realtime Server-Sent Events (SSE) stream routing
  location /events/ {
    proxy_pass http://127.0.0.1:8080/events/;
    proxy_http_version 1.1;

    # Disable proxy buffering and caching to prevent stalled event delivery
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_set_header Connection '';
    add_header X-Accel-Buffering "no" always;

    # Keep long-lived SSE connections open (prevents 60s gateway drops)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Main application, API, and web frontend proxy
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
